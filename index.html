<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attrape la balle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Attrape la balle</h1>
  <p>Utilise les flèches ou les boutons pour attraper la balle rouge.</p>

  <div class="infos">
    <span>Score : <strong id="score">0</strong></span>
    <span>Temps de jeu : <strong id="timer">00:00</strong></span>
  </div>

  <canvas id="game" width="400" height="400"></canvas><br>

  <div class="pad">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
